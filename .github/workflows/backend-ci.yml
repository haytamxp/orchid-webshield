name: WebShield P4 CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  backend-checks:
    name: P4 backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.9"
          cache: true
          cache-dependency-path: backend/go.mod

      - name: Verify Go toolchain
        shell: bash
        run: |
          go version
          actual="$(go env GOVERSION)"
          if [[ "$actual" != "go1.26.9" ]]; then
            echo "::error::Expected Go 1.26.9, received $actual"
            exit 1
          fi

      - name: Check Go formatting
        shell: bash
        run: |
          mapfile -d '' gofiles < <(
            find . -type f -name '*.go' -not -path '*/vendor/*' -print0
          )

          if ((${#gofiles[@]} == 0)); then
            echo "::error::No Go source files were found in the backend module."
            exit 1
          fi

          unformatted="$(gofmt -l "${gofiles[@]}")"

          if [[ -n "$unformatted" ]]; then
            echo "::error::The following Go files need formatting:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

          echo "PASS: all backend Go files are formatted."

      - name: Run go vet
        run: go vet -mod=readonly ./...

      - name: Run tests
        run: go test -count=1 -mod=readonly ./...

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -mod=readonly ./...

      - name: Build backend
        run: go build -mod=readonly ./...

  p4-sast:
    name: P4 backend SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.9"
          cache: true
          cache-dependency-path: backend/go.mod

      - name: Verify Go toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.26.9"

      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Scan backend
        run: |
          "$HOME/go/bin/gosec" ./...

  p4-dependency-scan:
    name: P4 backend dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.9"
          cache: true
          cache-dependency-path: backend/go.mod

      - name: Verify Go toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.26.9"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan backend dependencies
        run: |
          "$HOME/go/bin/govulncheck" ./...

  repository-secret-scan:
    name: Shared repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"